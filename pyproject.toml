[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiting-fairness-agents"
version = "0.1.0"
description = "Offline recruiting agents for a fictional staffing firm: PII redaction first, explainable skill matching, a measured fairness audit (selection rates, four-fifths rule, name-swap counterfactuals), human sign-off and a hash-chained audit log"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["matplotlib==3.9.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.1"]

[project.scripts]
recfair = "recfair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
